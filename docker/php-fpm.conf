; Pool PHP-FPM per produzione
; Sovrascrive la configurazione predefinita del container php:8.2-fpm-alpine

[www]
user = www-data
group = www-data

; Ascolta su localhost (nginx è nello stesso container)
listen = 127.0.0.1:9000

; Gestione processi dinamica (ottimizzata per server piccoli)
pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Timeout richieste PHP
request_terminate_timeout = 300s

; Log lento (solo per debug, usa 0 per disabilitare in produzione)
slowlog = /dev/stderr
request_slowlog_timeout = 0

; Invia log di errore a stderr (raccolta da Docker/supervisord)
php_flag[display_errors] = off
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
