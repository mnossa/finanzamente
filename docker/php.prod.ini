; Impostazioni PHP aggiuntive per produzione
; Applicate sopra a php.ini-production

; Limite memoria ragionevole per Laravel su server small
memory_limit = 256M

; Upload
upload_max_filesize = 10M
post_max_size = 12M

; Sessioni
session.gc_maxlifetime = 7200

; Timezone italiana
date.timezone = Europe/Rome

; Sicurezza
expose_php = Off
