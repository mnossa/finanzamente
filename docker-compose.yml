services:
  db_e2e:
    image: mysql:9.6
    container_name: finanzamente-db-e2e
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finanzamente_e2e
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: finanzamente
      MYSQL_PASSWORD: finanzamente
    volumes:
      - dbdata_e2e:/var/lib/mysql
    networks:
      - finanzamente
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finanzamente-app
    container_name: finanzamente-app
    restart: unless-stopped
    working_dir: /var/www
    # Usa UID/GID locali passati da shell (esportare LOCAL_UID/LOCAL_GID o usare Makefile)
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    ports:
      - "9000:9000"
    depends_on:
      - db
      - nginx
  db:
    image: mysql:9.6
    container_name: finanzamente-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finanzamente
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: finanzamente
      MYSQL_PASSWORD: finanzamente
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - finanzamente
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  nginx:
    image: nginx:alpine
    container_name: finanzamente-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - finanzamente
    # depends_on rimosso per evitare ciclo di dipendenze

  node:
    image: node:24
    container_name: finanzamente-node
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    tty: true
    # Allinea utente del container node con quello host per evitare file root/public/hot
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "5174:5174"

  scheduler:
    image: finanzamente-app
    container_name: finanzamente-scheduler
    restart: unless-stopped
    working_dir: /var/www
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    depends_on:
      - app
      - db
    command: >
      sh -c "while true; do php artisan schedule:run --verbose; sleep 60; done"

  mailpit:
    image: axllent/mailpit:latest
    container_name: finanzamente-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - finanzamente

  # Tunnel ngrok — espone nginx su HTTPS pubblico (solo sviluppo locale)
  # Richiede NGROK_AUTHTOKEN in .env.docker oppure come variabile d'ambiente
  # Per avviarlo: make ngrok  (oppure docker compose --profile tunnel up ngrok -d)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: finanzamente-ngrok
    restart: unless-stopped
    profiles:
      - tunnel
    command: http finanzamente-nginx:80 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    networks:
      - finanzamente
    ports:
      - "4040:4040"  # Web UI ngrok (stato tunnel e URL pubblico)

  # Servizio PHP-FPM dedicato ai test E2E Playwright.
  # Usa lo stesso codice del servizio app ma con il database E2E (db_e2e).
  # APP_CONFIG_CACHE punta a un file di cache separato (config_e2e.php) in modo
  # che i test E2E non tocchino MAI la config cache del server principale.
  app_e2e:
    image: finanzamente-app
    container_name: finanzamente-app-e2e
    restart: unless-stopped
    working_dir: /var/www
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env.docker
    environment:
      APP_ENV: e2e
      APP_KEY: "base64:vNOVx3glO6/vLSUkFdU4ziZ09echrYd8bIgnhPS1+Oo="
      APP_CONFIG_CACHE: /var/www/bootstrap/cache/config_e2e.php
      DB_HOST: db_e2e
      DB_PORT: "3306"
      DB_DATABASE: finanzamente_e2e
      DB_USERNAME: finanzamente
      DB_PASSWORD: finanzamente
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    depends_on:
      - db_e2e

  # Nginx dedicato ai test E2E — porta 8081, proxia verso app_e2e:9000.
  # Il server principale (porta 8080) resta intatto durante i test.
  nginx_e2e:
    image: nginx:alpine
    container_name: finanzamente-nginx-e2e
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./nginx/e2e.conf:/etc/nginx/conf.d/default.conf
    networks:
      - finanzamente
    depends_on:
      - app_e2e

volumes:
  dbdata:
  dbdata_e2e:
networks:
  finanzamente:
    driver: bridge
