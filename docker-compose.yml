services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finanzamente-app
    container_name: finanzamente-app
    restart: unless-stopped
    working_dir: /var/www
    # Usa UID/GID locali passati da shell (esportare LOCAL_UID/LOCAL_GID o usare Makefile)
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    ports:
      - "9000:9000"
    depends_on:
      - db
      - nginx
  db:
    image: mysql:8.0
    container_name: finanzamente-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finanzamente
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: finanzamente
      MYSQL_PASSWORD: finanzamente
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - finanzamente
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  nginx:
    image: nginx:alpine
    container_name: finanzamente-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - finanzamente
    # depends_on rimosso per evitare ciclo di dipendenze

  node:
    image: node:20
    container_name: finanzamente-node
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    tty: true
    # Allinea utente del container node con quello host per evitare file root/public/hot
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "5174:5174"

  scheduler:
    image: finanzamente-app
    container_name: finanzamente-scheduler
    restart: unless-stopped
    working_dir: /var/www
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    networks:
      - finanzamente
    depends_on:
      - app
      - db
    command: >
      sh -c "while true; do php artisan schedule:run --verbose; sleep 60; done"

  mailpit:
    image: axllent/mailpit:latest
    container_name: finanzamente-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - finanzamente

volumes:
  dbdata:
networks:
  finanzamente:
    driver: bridge
