# =============================================================================
# docker-compose.prod.yml — Stack di produzione per Hetzner
#
# USO:
#   docker compose -f docker-compose.prod.yml up -d
#
# VARIABILI d'ambiente richieste nel file .env (sul server):
#   APP_KEY, APP_URL, DB_DATABASE, DB_USERNAME, DB_PASSWORD,
#   DB_ROOT_PASSWORD, MAIL_*, ADV_THROTTLE_SALT, BACKUP_ENCRYPTION_KEY, IMAGE_TAG
# =============================================================================

services:

  # ── Applicazione (PHP-FPM + Nginx via supervisord) ─────────────────────────
  app:
    image: mnossa/finanzamente:${IMAGE_TAG:-latest}
    container_name: finanzamente-app
    restart: unless-stopped
    env_file: .env
    environment:
      # python-linker gira nello stesso container via supervisord (localhost)
      PYTHON_LINKER_URL: "http://127.0.0.1:8000"
    # Porta 80 gestita da Caddy: il container è raggiungibile solo internamente
    # ports:
    #   - "80:80"
    volumes:
      # Storage persistente (upload, cache sessioni, log)
      - storage:/var/www/storage
      # bootstrap/cache persistente per ottimizzare i restart
      - bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - finanzamente
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Scheduler Laravel (cron job) ───────────────────────────────────────────
  scheduler:
    image: mnossa/finanzamente:${IMAGE_TAG:-latest}
    container_name: finanzamente-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      # Non rieseguire migrate/optimize: già fatto dal container app
      SKIP_INIT: "true"
      # python-linker gira nel container app: raggiungibile via rete Docker interna
      PYTHON_LINKER_URL: "http://finanzamente-app:8000"
    volumes:
      - storage:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - finanzamente
    depends_on:
      app:
        condition: service_healthy
    # schedule:work polling nativo Laravel (ogni minuto)
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Queue worker Laravel (elabora job asincroni) ──────────────────────────
  queue-worker:
    image: mnossa/finanzamente:${IMAGE_TAG:-latest}
    container_name: finanzamente-queue-worker
    restart: unless-stopped
    env_file: .env
    environment:
      # Non rieseguire migrate/optimize: già fatto dal container app
      SKIP_INIT: "true"
      # python-linker gira nel container app: raggiungibile via rete Docker interna
      PYTHON_LINKER_URL: "http://finanzamente-app:8000"
    volumes:
      - storage:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
    networks:
      - finanzamente
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--sleep=1", "--timeout=120", "--no-interaction"]
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Database MySQL ──────────────────────────────────────────────────────────
  db:
    image: mysql:9.6
    container_name: finanzamente-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - finanzamente
    # NON esporre la porta al di fuori del container in produzione
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backup automatico MySQL ────────────────────────────────────────────────
  # Esegue mysqldump ogni 24h e mantiene gli ultimi 7 giorni.
  # I dump sono cifrati con AES-256-CBC tramite openssl prima di essere scritti
  # su disco: anche se il volume venisse copiato, i dati restano illeggibili
  # senza la chiave BACKUP_ENCRYPTION_KEY (da aggiungere in .env).
  #
  # Per ripristinare un dump:
  #   openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$BACKUP_ENCRYPTION_KEY" \
  #     -in /backups/finanzamente_20260414_020000.sql.gz.enc \
  #     | gunzip \
  #     | docker compose exec -T db mysql -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE"
  db-backup:
    image: mysql:9.6
    container_name: finanzamente-db-backup
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
    volumes:
      - backups:/backups
    networks:
      - finanzamente
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c '
        while true; do
          sleep 86400;
          FILENAME="/backups/finanzamente_$$(date +%Y%m%d_%H%M%S).sql.gz.enc";
          mysqldump -h db -u"$$DB_USERNAME" --password="$$DB_PASSWORD" "$$DB_DATABASE" \
            | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$$BACKUP_ENCRYPTION_KEY" \
            > "$$FILENAME";
          echo "[backup] $$(date): $$FILENAME creato";
          find /backups -name "finanzamente_*.sql.gz.enc" -mtime +7 -delete;
        done
      '
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"

  # ── Caddy (reverse proxy + TLS automatico Let's Encrypt) ─────────────────
  caddy:
    image: caddy:2-alpine
    container_name: finanzamente-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - finanzamente
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  finanzamente:
    driver: bridge

volumes:
  dbdata:
    driver: local
  storage:
    driver: local
  bootstrap_cache:
    driver: local
  backups:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
