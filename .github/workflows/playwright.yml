name: Test E2E Playwright — Finanzamente

# Attivazione: PR verso staging e push su staging
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  playwright:
    name: Test E2E con Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice sorgente
        uses: actions/checkout@v4

      - name: Imposta UID/GID per Docker Compose
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Crea .env.docker per l'ambiente CI
        run: |
          {
            echo "APP_NAME=Finanzamente"
            echo "APP_ENV=local"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "APP_DEBUG=false"
            echo "APP_URL=http://localhost:8080"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=db"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=finanzamente"
            echo "DB_USERNAME=finanzamente"
            echo "DB_PASSWORD=finanzamente"
            echo "SESSION_DRIVER=database"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
            echo "MAIL_MAILER=log"
            echo "ADV_THROTTLE_SALT=ci-e2e-salt-$(openssl rand -hex 8)"
            echo "E2E_USER_EMAIL=e2e@finanzamente.test"
            echo "E2E_USER_PASSWORD=password"
            echo "PRE_LAUNCH_MODE=false"
            echo "PRO_WAITLIST_ENABLED=false"
          } > .env.docker

      - name: Avvia stack Docker Compose (build + up)
        run: |
          LOCAL_UID=$LOCAL_UID LOCAL_GID=$LOCAL_GID docker compose up -d --build

      - name: Attendi che il container PHP sia pronto
        run: |
          timeout 120 bash -c             'until docker compose exec -T app php --version > /dev/null 2>&1; do sleep 5; echo "Attesa container app..."; done'
          docker compose ps

      - name: Attendi che MySQL sia pronto
        run: |
          timeout 120 bash -c             'until docker compose exec -T db mysqladmin ping -h localhost --silent 2>/dev/null; do sleep 5; echo "Attesa database MySQL..."; done'
          echo "MySQL pronto."

      - name: Installa dipendenze PHP (Composer)
        run: |
          docker compose exec -T app composer install             --optimize-autoloader             --no-interaction

      - name: Esegui migrazioni e seeder E2E
        run: |
          docker compose exec -T app php artisan migrate:fresh --force
          docker compose exec -T app php artisan db:seed --class=E2ESeeder --force

      - name: Configura Node.js per Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Installa dipendenze Node.js
        run: npm ci



      - name: Build asset frontend (Vite)
        run: npm run build

      - name: Debug HTML /accedi
        run: |
          curl -fs http://localhost:8080/accedi > accedi.html || true

      - name: Healthcheck applicativo su /accedi
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8080/accedi | grep -q "Accedi"; then
              echo "Login page pronta!"
              exit 0
            fi
            echo "Attesa login page pronta..."
            sleep 3
          done
          echo "Timeout: login page non pronta dopo 90 secondi"
          docker compose logs app
          exit 1

      - name: Carica HTML /accedi come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: accedi-html
          path: accedi.html
          retention-days: 3

      - name: Installa browser Playwright (solo Chromium per CI)
        run: npx playwright install chromium --with-deps

      - name: Esegui test E2E Playwright
        run: npx playwright test --project=setup --project=pubblico --project=autenticato-desktop
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:8080"
          E2E_USER_EMAIL: "e2e@finanzamente.test"
          E2E_USER_PASSWORD: "password"

      - name: Ferma stack Docker Compose
        if: always()
        run: docker compose down --volumes

      - name: Carica report Playwright come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
