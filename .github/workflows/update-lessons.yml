name: Aggiorna lessons.md

# Attivazione: ad ogni push sul branch main
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-lessons:
    name: Aggiungi voce a tasks/lessons.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Anti-loop: salta i commit generati da github-actions (nome e email)
      # per evitare che il push di questo job attivi nuovamente il workflow
      # all'infinito.
      - name: Verifica autore commit
        id: check_author
        run: |
          AUTHOR=$(git log -1 --pretty='%an')
          EMAIL=$(git log -1 --pretty='%ae')
          if [ "$AUTHOR" = "github-actions" ] || [ "$EMAIL" = "github-actions@github.com" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggiorna tasks/lessons.md
        if: steps.check_author.outputs.skip == 'false'
        run: |
          DATE=$(git log -1 --pretty='%ad' --date=short)
          AUTHOR=$(git log -1 --pretty='%an')
          SUBJECT=$(git log -1 --pretty='%s')
          HASH=$(git log -1 --pretty='%h')

          mkdir -p tasks
          touch tasks/lessons.md

          echo "- [${DATE}] ${SUBJECT} (${HASH}) — ${AUTHOR}" >> tasks/lessons.md

      - name: Commit e push delle modifiche
        if: steps.check_author.outputs.skip == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tasks/lessons.md
          # Evita il commit se non ci sono modifiche reali
          git diff --cached --quiet || git commit -m "docs: aggiorna lessons.md [skip ci]"
          git push
