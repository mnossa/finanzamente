name: Deploy to Production — Finanzamente

# Deploy: test → build immagine → SSH su VPS. Concurrency senza cancel (nessun deploy
# interrotto a metà). Rollback verifica compose, health e smoke HTTP.

# Attivazione: ad ogni push sul branch main
on:
  push:
    branches:
      - main

# Permessi minimi: solo lettura del codice
permissions:
  contents: read

# Un solo deploy alla volta su main; niente cancel del run in corso (evita stato
# incoerente sul VPS se arriva un secondo push durante il deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Job 1: Esegui la suite di test ────────────────────────────────────────────
  test:
    name: Esegui Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend (typecheck + Vite build)
        run: |
          npm ci
          npm run build

      - name: Imposta UID/GID per Docker Compose
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Crea .env.docker per l'ambiente CI
        run: |
          {
            echo "APP_NAME=Finanzamente"
            echo "APP_ENV=testing"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "APP_DEBUG=false"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=db"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=finanzamente"
            echo "DB_USERNAME=finanzamente"
            echo "DB_PASSWORD=finanzamente"
            echo "SESSION_DRIVER=database"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
            echo "MAIL_MAILER=log"
            echo "ADV_THROTTLE_SALT=ci-salt-$(openssl rand -hex 8)"
          } > .env.docker

      - name: Avvia stack Docker Compose (sviluppo)
        run: docker compose up -d --build --remove-orphans

      - name: Attendi che il container PHP sia pronto
        run: |
          timeout 120 bash -c \
            'until docker compose exec -T app php --version > /dev/null 2>&1; do sleep 5; echo "Attesa container app..."; done'

      - name: Installa dipendenze PHP nel container
        run: |
          docker compose exec -T \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/composer \
            -e COMPOSER_CACHE_DIR=/tmp/composer/cache \
            app sh -lc 'mkdir -p /tmp/composer/cache && composer install \
            --optimize-autoloader \
            --no-interaction'

      - name: Verifica gate backend (Pint + test)
        run: make test-ci

      - name: Smoke HTTP (nginx → app, come in locale)
        run: |
          timeout 90 bash -c 'until curl -sf --max-time 8 http://localhost:8080/up >/dev/null 2>&1; do sleep 3; echo "Attesa /up su :8080..."; done'
          echo "Smoke OK: http://localhost:8080/up"

      - name: Debug logs in caso di test falliti
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps || true
          echo "=== ultimi log container app ==="
          docker compose logs --tail=200 app || true
          echo "=== ultimi log container db ==="
          docker compose logs --tail=200 db || true

      - name: Ferma stack Docker Compose
        if: always()
        run: docker compose down --volumes

  # ── Job 2: Build immagine Docker e push su Docker Hub ─────────────────────────
  build:
    name: Build e Push Immagine Docker
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image-tag: latest
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Libera spazio disco sul runner
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/share/swift \
                      /usr/local/.ghcup
          sudo docker image prune -af
          df -h

      - name: Checkout del codice sorgente
        uses: actions/checkout@v6

      - name: Configura Docker Buildx (multi-platform + cache)
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login a Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ruota tag latest -> previous
        run: |
          docker buildx imagetools create -t mnossa/finanzamente:previous mnossa/finanzamente:latest || true

      - name: Calcola tag immagine
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: mnossa/finanzamente
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push immagine app (multi-stage)
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}


  # ── Job 3: Deploy su Hetzner via SSH ──────────────────────────────────────────
  deploy:
    name: Deploy su Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v6

      - name: Copia docker-compose.prod.yml sul server
        uses: appleboy/scp-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/finanzamente/

      - name: Deploy via SSH su Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR="/opt/finanzamente"
            IMAGE_TAG="latest"
            CONTAINER_NAME="finanzamente-app"

            echo "==> [deploy] Versione: ${IMAGE_TAG}"
            cd "${DEPLOY_DIR}"

            PREVIOUS_TAG="previous"
            echo "==> [deploy] Versione precedente: ${PREVIOUS_TAG:-<nessuna>}"

            wait_app_healthy() {
              local max_wait="${1:-300}"
              local deadline=$(( $(date +%s) + max_wait ))
              echo "==> [deploy] Attesa healthcheck ${CONTAINER_NAME} (max ${max_wait}s)..."
              while true; do
                STATUS=$(docker inspect --format '{{.State.Health.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "unknown")
                case "${STATUS}" in
                  healthy)
                    echo "==> [deploy] App healthy."
                    return 0
                    ;;
                  unhealthy)
                    echo "==> [deploy] App in stato unhealthy."
                    return 1
                    ;;
                  *)
                    if [ "$(date +%s)" -ge "${deadline}" ]; then
                      echo "==> [deploy] Timeout attesa health app."
                      return 1
                    fi
                    echo "    ... stato: ${STATUS}"
                    sleep 10
                    ;;
                esac
              done
            }

            smoke_http_up() {
              echo "==> [deploy] Smoke HTTP (Caddy / stack pubblico)..."
              if ! curl -sf --max-time 25 "http://127.0.0.1/up" >/dev/null; then
                echo "==> [deploy] Smoke fallito: http://127.0.0.1/up"
                return 1
              fi
              APP_URL_LINE=$(grep -E '^APP_URL=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//;s:/*$::' || true)
              if echo "${APP_URL_LINE}" | grep -qE '^https://'; then
                if ! curl -sf --max-time 25 "${APP_URL_LINE}/up" >/dev/null; then
                  echo "==> [deploy] Smoke fallito: ${APP_URL_LINE}/up"
                  return 1
                fi
              fi
              echo "==> [deploy] Smoke HTTP OK."
            }

            check_disk_space() {
              local min_mb="${1:-4096}"
              echo "==> [deploy] Verifica spazio disco (min ${min_mb} MiB liberi)..."
              AVAIL=$(df -Pm / 2>/dev/null | tail -1 | awk '{print $4}')
              if [ -z "${AVAIL}" ] || ! [[ "${AVAIL}" =~ ^[0-9]+$ ]]; then
                echo "==> [deploy] Avviso: df su / non leggibile, continuo."
                return 0
              fi
              if [ "${AVAIL}" -lt "${min_mb}" ]; then
                echo "==> [deploy] ERRORE: su / ci sono solo ${AVAIL} MiB liberi (minimo richiesto ${min_mb})."
                exit 1
              fi
              DR=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
              if [ -n "${DR}" ]; then
                AVAIL_DR=$(df -Pm "${DR}" 2>/dev/null | tail -1 | awk '{print $4}')
                if [ -n "${AVAIL_DR}" ] && [[ "${AVAIL_DR}" =~ ^[0-9]+$ ]] && [ "${AVAIL_DR}" -lt "${min_mb}" ]; then
                  echo "==> [deploy] ERRORE: su ${DR} solo ${AVAIL_DR} MiB liberi (minimo ${min_mb})."
                  exit 1
                fi
              fi
              echo "==> [deploy] Spazio disco OK ( / ~${AVAIL} MiB liberi )."
            }

            prune_old_finanzamente_images() {
              local repo="mnossa/finanzamente"
              local keep=2
              echo "==> [deploy] Prune ${repo}: mantengo le ${keep} digest più recenti (per .Created)..."
              docker images "${repo}" -aq 2>/dev/null | sort -u | while read -r iid; do
                [ -z "${iid}" ] && continue
                docker image inspect --format '{{.Created}}\t{{.Id}}' "${iid}" 2>/dev/null || true
              done | sort -r | tail -n +$((keep + 1)) | cut -f2 | while read -r rid; do
                [ -z "${rid}" ] && continue
                echo "    docker rmi ${rid}"
                docker rmi "${rid}" 2>/dev/null || true
              done
            }

            # Pulizia Docker **prima** del gate su spazio libero: così un VPS quasi pieno
            # libera cache/layer inutilizzati e il check non fallisce senza aver tentato recovery.
            prune_docker_before_disk_gate() {
              echo "==> [deploy] Pre-pulizia Docker (cache build, dangling, vecchie immagini, container fermi)..."
              docker builder prune -af || true
              docker image prune -f || true
              prune_old_finanzamente_images
              docker image prune -af --filter "until=168h" || true
              docker container prune -f || true
              docker network prune -f || true
              docker system prune -f || true
            }

            rollback() {
              trap - ERR
              echo "==> [deploy] ERRORE! Rollback verso: ${PREVIOUS_TAG:-<nessuno>}"
              docker compose -f docker-compose.prod.yml logs app --tail=80 || true
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREVIOUS_TAG}|" .env
              if ! docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
                echo "==> [deploy] CRITICO: docker compose up dopo rollback fallito."
                exit 1
              fi
              if ! wait_app_healthy 240; then
                echo "==> [deploy] CRITICO: app non healthy dopo rollback."
                exit 1
              fi
              if ! smoke_http_up; then
                echo "==> [deploy] CRITICO: smoke HTTP fallito dopo rollback."
                exit 1
              fi
              echo "==> [deploy] Fine manutenzione dopo rollback (artisan up)..."
              docker compose -f docker-compose.prod.yml exec -T app php artisan up || echo "==> [deploy] AVVISO: artisan up dopo rollback non riuscito (controlla manualmente)."
              docker compose -f docker-compose.prod.yml exec -T app php artisan view:clear || echo "==> [deploy] AVVISO: view:clear dopo rollback non riuscito."
              echo "==> [deploy] Rollback riuscito. Versione runtime: ${PREVIOUS_TAG} (il job segnala fallimento deploy)."
              exit 1
            }

            DEPLOY_MIN_FREE_MB=$(grep -E '^DEPLOY_MIN_FREE_MB=' .env 2>/dev/null | cut -d= -f2- | tr -d ' "\r' || true)
            # Default 4096 MiB (~4 GiB): su VPS piccoli 6144 bloccava deploy prima di qualsiasi prune.
            DEPLOY_MIN_FREE_MB=${DEPLOY_MIN_FREE_MB:-4096}

            prune_docker_before_disk_gate

            echo "==> [deploy] Spazio disco dopo pre-pulizia (root e Docker root):"
            df -h / | tail -1
            DR=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
            if [ -n "${DR}" ]; then df -h "${DR}" | tail -1 || true; fi

            check_disk_space "${DEPLOY_MIN_FREE_MB}"

            trap rollback ERR

            # Pull la nuova immagine da Docker Hub
            echo "==> [deploy] Pull immagine Docker Hub..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml pull app scheduler queue-worker

            # Aggiorna IMAGE_TAG nel file .env del server
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            # Avvia DB isolato (--no-deps evita che docker risolva dipendenze a cascata)
            echo "==> [deploy] Avvio DB..."
            docker compose -f docker-compose.prod.yml up -d --no-deps db

            # Attendi esplicitamente che MySQL sia healthy prima di procedere (max 3 min)
            echo "==> [deploy] Attesa MySQL healthy (max 3 min)..."
            DB_DEADLINE=$(($(date +%s) + 180))
            while true; do
              DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' finanzamente-db 2>/dev/null || echo "unknown")
              if [ "${DB_STATUS}" = "healthy" ]; then
                echo "==> [deploy] MySQL healthy!"
                break
              fi
              if [ "$(date +%s)" -ge "${DB_DEADLINE}" ]; then
                echo "==> [deploy] TIMEOUT: MySQL non è healthy entro 3 minuti."
                docker logs finanzamente-db --tail=50 || true
                false
              fi
              echo "    In attesa MySQL... (stato: ${DB_STATUS})"
              sleep 10
            done

            # Avvia il resto dell'infrastruttura (no-recreate + no-deps)
            echo "==> [deploy] Avvio infrastruttura..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-recreate caddy db-backup

            # Manutenzione cortesia: durante il recreate gli utenti vedono 503 con messaggio, non errori sparsi.
            echo "==> [deploy] Manutenzione programmata (artisan down)..."
            if ! docker compose -f docker-compose.prod.yml exec -T app php artisan down --retry=120 --render=maintenance.deploy; then
              echo "==> [deploy] AVVISO: artisan down non riuscito — il deploy prosegue comunque."
            fi

            echo "==> [deploy] Riavvio container app (nuova immagine)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app scheduler queue-worker

            wait_app_healthy 300

            smoke_http_up

            echo "==> [deploy] Fine manutenzione (artisan up)..."
            if ! docker compose -f docker-compose.prod.yml exec -T app php artisan up; then
              echo "==> [deploy] ERRORE: artisan up fallito dopo deploy riuscito."
              exit 1
            fi

            echo "==> [deploy] Svuotamento cache view compilate (Blade)..."
            if ! docker compose -f docker-compose.prod.yml exec -T app php artisan view:clear; then
              echo "==> [deploy] ERRORE: view:clear fallito dopo deploy."
              exit 1
            fi

            # Disattiva il trap ERR dopo il successo (la pulizia non deve attivare rollback)
            trap - ERR

            # 2ª volta **dopo il recreate**: il digest appena sostituito non è più usato dai container →
            #    spesso solo qui diventa eliminabile oltre il limite delle 2 versioni (non è duplicato inutile).
            echo "==> [deploy] Prune tag app oltre le 2 più recenti (post-switch immagine)..."
            prune_old_finanzamente_images

            # Log spazio disco post-deploy
            echo "==> [deploy] Spazio disco disponibile:"
            df -h / | tail -1

            echo "==> [deploy] Deploy completato! Versione attiva: ${IMAGE_TAG}"
