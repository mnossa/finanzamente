name: Deploy to Production — Finanzamente

# Attivazione: ad ogni push sul branch main
on:
  push:
    branches:
      - main

# Permessi minimi: solo lettura del codice
permissions:
  contents: read

# Qui inserisci il blocco concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Esegui la suite di test ────────────────────────────────────────────
  test:
    name: Esegui Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend (typecheck + Vite build)
        run: |
          npm ci
          npm run build

      - name: Imposta UID/GID per Docker Compose
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Crea .env.docker per l'ambiente CI
        run: |
          {
            echo "APP_NAME=Finanzamente"
            echo "APP_ENV=testing"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "APP_DEBUG=false"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=db"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=finanzamente"
            echo "DB_USERNAME=finanzamente"
            echo "DB_PASSWORD=finanzamente"
            echo "SESSION_DRIVER=database"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
            echo "MAIL_MAILER=log"
            echo "ADV_THROTTLE_SALT=ci-salt-$(openssl rand -hex 8)"
          } > .env.docker

      - name: Avvia stack Docker Compose (sviluppo)
        run: docker compose up -d --build

      - name: Attendi che il container PHP sia pronto
        run: |
          timeout 120 bash -c \
            'until docker compose exec -T app php --version > /dev/null 2>&1; do sleep 5; echo "Attesa container app..."; done'

      - name: Installa dipendenze PHP nel container
        run: |
          docker compose exec -T \
            -e HOME=/tmp \
            -e COMPOSER_HOME=/tmp/composer \
            -e COMPOSER_CACHE_DIR=/tmp/composer/cache \
            app sh -lc 'mkdir -p /tmp/composer/cache && composer install \
            --optimize-autoloader \
            --no-interaction'

      - name: Verifica gate backend (Pint + test)
        run: make test-ci

      - name: Debug logs in caso di test falliti
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps || true
          echo "=== ultimi log container app ==="
          docker compose logs --tail=200 app || true
          echo "=== ultimi log container db ==="
          docker compose logs --tail=200 db || true

      - name: Ferma stack Docker Compose
        if: always()
        run: docker compose down --volumes

  # ── Job 2: Build immagine Docker e push su Docker Hub ─────────────────────────
  build:
    name: Build e Push Immagine Docker
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Libera spazio disco sul runner
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/share/swift \
                      /usr/local/.ghcup
          sudo docker image prune -af
          df -h

      - name: Checkout del codice sorgente
        uses: actions/checkout@v6

      - name: Configura Docker Buildx (multi-platform + cache)
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login a Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcola tag immagine
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: mnossa/finanzamente
          tags: |
            # Tag con SHA breve (es. sha-abc1234)
            type=sha,format=short
            # Tag "latest" solo su main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push immagine app (multi-stage)
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}


  # ── Job 3: Deploy su Hetzner via SSH ──────────────────────────────────────────
  deploy:
    name: Deploy su Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v6

      - name: Copia docker-compose.prod.yml sul server
        uses: appleboy/scp-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/finanzamente/

      - name: Deploy via SSH su Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR="/opt/finanzamente"
            IMAGE_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            CONTAINER_NAME="finanzamente-app"

            echo "==> [deploy] Versione: ${IMAGE_TAG}"
            cd "${DEPLOY_DIR}"

            # Salva il tag corrente per eventuale rollback
            PREVIOUS_TAG=$(grep "^IMAGE_TAG=" .env | cut -d= -f2 || true)
            echo "==> [deploy] Versione precedente: ${PREVIOUS_TAG:-<nessuna>}"

            # Funzione di rollback: ripristina la versione precedente in caso di errore
            rollback() {
              echo "==> [deploy] ERRORE! Avvio rollback a ${PREVIOUS_TAG}..."
              docker compose -f docker-compose.prod.yml logs app --tail=50 || true
              if [ -n "${PREVIOUS_TAG}" ] && [ "${PREVIOUS_TAG}" != "${IMAGE_TAG}" ]; then
                sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREVIOUS_TAG}|" .env
                docker compose -f docker-compose.prod.yml up -d --remove-orphans || true
                echo "==> [deploy] Rollback completato. Versione attiva: ${PREVIOUS_TAG}"
              else
                echo "==> [deploy] Nessuna versione precedente disponibile per il rollback."
              fi
            }
            trap rollback ERR

            # Pulizia preventiva immagini obsolete prima del pull (evita "no space left on device")
            echo "==> [deploy] Pulizia immagini obsolete pre-pull..."
            docker image prune -af --filter "until=168h" || true
            echo "==> [deploy] Spazio disco disponibile:"
            df -h / | tail -1

            # Pull la nuova immagine da Docker Hub
            echo "==> [deploy] Pull immagine Docker Hub..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml pull app scheduler

            # Aggiorna IMAGE_TAG nel file .env del server
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            # Avvia DB isolato (--no-deps evita che docker risolva dipendenze a cascata)
            echo "==> [deploy] Avvio DB..."
            docker compose -f docker-compose.prod.yml up -d --no-deps db

            # Attendi esplicitamente che MySQL sia healthy prima di procedere (max 3 min)
            echo "==> [deploy] Attesa MySQL healthy (max 3 min)..."
            DB_DEADLINE=$(($(date +%s) + 180))
            while true; do
              DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' finanzamente-db 2>/dev/null || echo "unknown")
              if [ "${DB_STATUS}" = "healthy" ]; then
                echo "==> [deploy] MySQL healthy!"
                break
              fi
              if [ "$(date +%s)" -ge "${DB_DEADLINE}" ]; then
                echo "==> [deploy] TIMEOUT: MySQL non è healthy entro 3 minuti."
                docker logs finanzamente-db --tail=50 || true
                false
              fi
              echo "    In attesa MySQL... (stato: ${DB_STATUS})"
              sleep 10
            done

            # Avvia il resto dell'infrastruttura (no-recreate + no-deps)
            echo "==> [deploy] Avvio infrastruttura..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-recreate caddy db-backup

            # Riavvia solo i container app con la nuova immagine
            echo "==> [deploy] Riavvio container app..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans app scheduler

            # Attendi lo stato "healthy" del Docker healthcheck nativo (max 5 min).
            # Il docker-compose.prod.yml configura: start_period=90s, interval=30s, retries=3
            # → il tempo massimo prima di "unhealthy" è 90+30*3=180s → usiamo 300s come timeout.
            echo "==> [deploy] Attesa health check Docker (max 5 min)..."
            DEADLINE=$(($(date +%s) + 300))
            while true; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "unknown")
              case "${STATUS}" in
                healthy)
                  echo "==> [deploy] App healthy!"
                  break
                  ;;
                unhealthy)
                  echo "==> [deploy] ERRORE: container unhealthy dopo il deploy."
                  false  # attiva il trap ERR → rollback
                  ;;
                *)
                  if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                    echo "==> [deploy] TIMEOUT: health check non completato entro 5 minuti."
                    false  # attiva il trap ERR → rollback
                  fi
                  echo "    In attesa... (stato: ${STATUS})"
                  sleep 10
                  ;;
              esac
            done

            # Disattiva il trap ERR dopo il successo (la pulizia non deve attivare rollback)
            trap - ERR

            # Pulizia immagini obsolete (libera spazio su disco).
            # --filter "until=48h" rimuove le immagini scaricate più di 2 giorni fa,
            # mantenendo sempre quella corrente e le recenti per rollback rapido.
            echo "==> [deploy] Pulizia immagini vecchie (>2 giorni)..."
            docker image prune -af --filter "until=48h"

            # Log spazio disco post-deploy
            echo "==> [deploy] Spazio disco disponibile:"
            df -h / | tail -1

            echo "==> [deploy] Deploy completato! Versione attiva: ${IMAGE_TAG}"
