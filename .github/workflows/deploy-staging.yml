name: Deploy Staging — Finanzamente

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice sorgente
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installa dipendenze Node.js
        run: npm ci

      - name: Build asset frontend (Vite)
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo, pdo_mysql, intl, fileinfo, curl, gd, zip
          coverage: none

      - name: Installa dipendenze PHP
        run: composer install --optimize-autoloader --no-interaction --no-dev --ignore-platform-reqs

      - name: Calcola tag release
        id: version
        run: |
          TAG="staging-v$(date +'%Y%m%d')-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "filename=finanzamente-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Prepara archivio release
        run: |
          mkdir -p release
          tar czf "release/${{ steps.version.outputs.filename }}" \
            --exclude=release \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.github \
            .

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Staging ${{ steps.version.outputs.tag }}"
          body: |
            Release automatica staging dal branch `staging`.
            Commit: ${{ github.sha }}
          files: release/${{ steps.version.outputs.filename }}
          prerelease: true
